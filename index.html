<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jet Lag Scheduler</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; padding: 20px; }
        label { display: block; margin-top: 10px; }
        input { width: 250px; padding: 5px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px 20px; }
        #message { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Jet Lag Scheduler</h2>
    <form id="flightForm">
        <label>Name: <input type="text" name="name" required></label>
        <label>Origin (timezone, e.g., Asia/Taipei): <input type="text" name="origin" required></label>
        <label>Destination (timezone, e.g., America/Los_Angeles): <input type="text" name="destination" required></label>
        <label>Departure DateTime (YYYY-MM-DD HH:MM): <input type="text" name="depart_datetime" placeholder="YYYY-MM-DD HH:MM" required></label>
        <label>Flight Hours: <input type="number" name="flight_hours" required></label>
        <label>Direction (east/west): <input type="text" name="direction" required></label>
        <label>Pre-Flight Adjustment Days: <input type="number" name="pre_days" required></label>
        <label>Post-Flight Adjustment Days: <input type="number" name="post_days" required></label>
        <label>Average Bedtime (0-23): <input type="number" name="avg_sleep_start" required></label>
        <label>Average Wake Up Time (0-23): <input type="number" name="avg_sleep_end" required></label>
        <button type="submit">Submit</button>
    </form>
    <div id="message"></div>

    <script>
        const form = document.getElementById("flightForm");
        const messageDiv = document.getElementById("message");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            // Collect form data
            const data = {};
            for (let element of form.elements) {
                if (element.name) {
                    data[element.name] = element.value;
                }
            }

            try {
                const response = await fetch("http://127.0.0.1:5000/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                const result = await response.json();
                messageDiv.innerHTML = ` Flight schedule saved! Flight ID: ${result.flight_id}`;
                console.log("Pre-schedule:", result.pre_schedule);
                console.log("Post-schedule:", result.post_schedule);

            } catch (error) {
                console.error(error);
                messageDiv.innerHTML = ` Failed to submit. Make sure Flask backend is running.`;
            }
        });
    </script>
</body>
</html>
